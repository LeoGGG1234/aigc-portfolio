<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>二十四枚 · 20秒预览与托管测试</title><style>body{margin:0;background:#f5efe6;color:#241f1b;font:16px/1.7 system-ui,-apple-system,"PingFang SC",sans-serif}main{max-width:880px;margin:auto;padding:24px}h1{font-weight:400;font-size:36px;line-height:1.25}.meta{font-size:14px;color:#776553}.screen{display:grid;place-items:center;background:#171713;padding:12px;border-radius:8px}video{display:block;width:min(100%,350px);max-height:72vh;aspect-ratio:9/16;background:#111}button{font:inherit;border:1px solid #b9aa9d;background:transparent;color:inherit;padding:8px 16px;border-radius:20px;margin:12px 0;cursor:pointer}output{display:block;white-space:pre-wrap;font:14px/1.7 system-ui}details{margin-top:24px;border-top:1px solid #d8cfc3;padding-top:16px}a{color:inherit}</style></head><body><main><p class="meta">P. ÆVRYX · 独立测试入口</p><h1>《二十四枚》预览</h1><p>截取 v32 的约 00:43.20–01:03.56，保留原片顺序，加入短淡入淡出。此入口仅包含预览，不包含完整成片或简历；正式网站尚未迁移。</p><p class="meta">约 20 秒 · 720 × 1280 · 30fps · 6 MB · H.264 / AAC</p><div class="screen"><video id="preview" controls playsinline preload="metadata" poster="poster.jpg"><source src="preview.mp4" type="video/mp4"></video></div><p class="meta">点击播放，可拖动进度条。</p><details open><summary>播放与下载测试</summary><output id="play-status">等待点击播放</output><button id="download-test" type="button">测试前 2 MiB 下载速度</button><output id="download-status">测试仅下载预览的一部分，不上传访客信息。结果只反映当前浏览器的网络。</output></details></main><script>const v=document.querySelector('video'),p=document.querySelector('#play-status');let begin=0,first=0,waits=0;function state(){const ahead=v.buffered.length?Math.max(0,v.buffered.end(v.buffered.length-1)-v.currentTime):0;p.textContent=`播放位置：${v.currentTime.toFixed(1)} / ${v.duration||20.37} 秒\n首次起播：${first?first.toFixed(2)+' 秒':'尚未记录'}；缓冲事件：${waits} 次；前方缓冲：${ahead.toFixed(1)} 秒`;}v.addEventListener('play',()=>{if(!begin)begin=performance.now()});v.addEventListener('playing',()=>{if(!first&&begin)first=(performance.now()-begin)/1000;state()});v.addEventListener('waiting',()=>{if(begin)waits++;state()});v.addEventListener('timeupdate',state);v.addEventListener('error',()=>{p.textContent='视频加载错误：'+v.error?.message});document.querySelector('#download-test').onclick=async function(){this.disabled=true;const out=document.querySelector('#download-status'),controller=new AbortController();let n=0;const cap=2097152,start=performance.now();const timer=setTimeout(()=>controller.abort(),20000);try{const r=await fetch('preview.mp4?speedtest=1',{headers:{Range:'bytes=0-2097151'},cache:'no-store',signal:controller.signal});if(!r.ok)throw Error('HTTP '+r.status);const reader=r.body.getReader();while(n<cap){const {done,value}=await reader.read();if(done)break;n+=value.length;}await reader.cancel();const sec=(performance.now()-start)/1000;out.textContent=`实际读取：${(n/1048576).toFixed(2)} MiB；耗时：${sec.toFixed(2)} 秒\n短样本平均速度：${(n*8/sec/1e6).toFixed(2)} Mbps（含建连、首字节等待）\nHTTP ${r.status}。预览平均码率约 2.35 Mbps；短时测速不代表长期速度。`;}catch(e){out.textContent='测试未完成：'+e.message;}finally{clearTimeout(timer);this.disabled=false;}};</script></body></html>
